# Weekly dependency updates, grouped so there is one PR per ecosystem instead of one per package.
# Every game is its own npm project, so each gets its own entry; add one when you add a game.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # SvelteKit, svelte-check and typescript-eslint only support TypeScript up to 6.
      - dependency-name: typescript
        versions: ['>=7']
      # Node's types follow the Node version CI runs on (24); move both together, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /games/duck
    schedule:
      interval: weekly
      day: monday
    groups:
      all:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /games/bug-bash
    schedule:
      interval: weekly
      day: monday
    groups:
      all:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /games/git-gud
    schedule:
      interval: weekly
      day: monday
    groups:
      all:
        patterns: ['*']
    ignore:
      # same as the hub: stay on TypeScript 6 for now
      - dependency-name: typescript
        versions: ['>=7']

