# Checks every pull request without deploying anything:
# lint, type-check and unit tests for the hub, each game's own tests, and end-to-end + accessibility tests on the full build.
name: PR check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            games/*/package-lock.json

      # Bug Bash is Rust compiled to WebAssembly; the runner has rustup, it only needs the target
      - run: rustup target add wasm32-unknown-unknown

      # Dependency Hell is C++ compiled to WebAssembly with Emscripten
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      # Standup Survivor is Kotlin; Gradle comes with its wrapper, it needs a JDK
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run build

      - run: npm run test:games

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
