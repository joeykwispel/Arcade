# Checks every pull request without deploying anything:
# lint, type-check and unit tests for the hub, each game's own tests, and end-to-end + accessibility tests on the full build.
name: PR check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            games/*/package-lock.json

      # Bug Bash is Rust compiled to WebAssembly; the runner has rustup, it only needs the target
      - run: rustup target add wasm32-unknown-unknown

      # Dependency Hell is C++ compiled to WebAssembly with Emscripten
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      # Localhost Golf is Godot: the editor (for a headless export) and its single-threaded web template.
      # The export templates come as one 1.3 GB archive; only the web template is kept, and cached.
      - uses: actions/cache@v6
        with:
          path: ~/godot-templates
          key: godot-web-template-4.7.2
      - name: Install Godot 4.7.2
        run: |
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          cd /tmp
          curl -sSLO "$base/SHA512-SUMS.txt"
          curl -sSLO "$base/Godot_v4.7.2-stable_linux.x86_64.zip"
          grep " Godot_v4.7.2-stable_linux.x86_64.zip$" SHA512-SUMS.txt | sha512sum -c
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d ~/godot
          if [ ! -f ~/godot-templates/web_nothreads_release.zip ]; then
            curl -sSLO "$base/Godot_v4.7.2-stable_export_templates.tpz"
            grep " Godot_v4.7.2-stable_export_templates.tpz$" SHA512-SUMS.txt | sha512sum -c
            unzip -q -j Godot_v4.7.2-stable_export_templates.tpz templates/web_nothreads_release.zip -d ~/godot-templates
            rm Godot_v4.7.2-stable_export_templates.tpz
          fi
          echo "GODOT=$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "GODOT_TEMPLATES=$HOME/godot-templates" >> "$GITHUB_ENV"

      # Code Review Tinder is Dart + Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # Dev-Ware is Gleam, compiled to JavaScript: no Erlang needed
      - uses: erlef/setup-beam@v1
        with:
          gleam-version: 1.18.1
          otp-version: false

      # Standup Survivor is Kotlin; Gradle comes with its wrapper, it needs a JDK
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run build

      - run: npm run test:games

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
