<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0a0e17" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Infinite Scroll</title>
    <meta name="description" content="Fly a cursor through an endless tunnel of code and dodge the exceptions. 3D, in the browser." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="stage" id="stage" data-phase="loading">
      <canvas id="game" aria-hidden="true"></canvas>
      <div class="hud" aria-hidden="true">
        <p><b id="score">0</b> <span id="score-label"></span></p>
        <p class="right"><span id="best-label"></span> <b id="best">0</b></p>
        <p class="status" id="status"></p>
      </div>
      <div class="overlay" id="overlay">
        <p class="title" id="title"></p>
        <p class="sub" id="sub"></p>
        <p class="hint" id="hint"></p>
        <p class="small" id="small"></p>
      </div>
      <p class="fallback" id="fallback" hidden>This game needs WebGL, which this browser doesn't offer.</p>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </main>
    <script type="module" src="./src/Main.res.mjs"></script>
  </body>
</html>
