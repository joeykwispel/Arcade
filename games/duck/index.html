<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0a0e17" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Rubber Duck Run</title>
    <meta name="description" content="The offline dino game, for developers: jump the bugs and merge conflicts, duck under the meeting invites." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/main.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <canvas id="game" aria-hidden="true"></canvas>
      <div class="overlay" id="overlay">
        <p class="title" id="title"></p>
        <p class="sub" id="sub"></p>
        <p class="hint" id="hint"></p>
      </div>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </main>
    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
